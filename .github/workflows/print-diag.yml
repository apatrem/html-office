name: Print diagnostic (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix packages/text --ignore-scripts
      - name: Environment
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)'; free -m; df -h /tmp | tail -1; which firefox; readlink -f "$(which firefox)"; firefox --version; echo "TMPDIR=$TMPDIR"
      - name: Loop the test
        run: |
          set +e
          mkdir -p diag
          fails=0
          for i in 1 2 3 4 5 6; do
            echo "::group::iteration $i"
            MOZ_LOG="printing:4,DeviceContextSpecGTK:5,timestamp,sync" MOZ_LOG_FILE="$PWD/diag/moz-$i" PF_DIAG="$PWD/diag/stderr-$i.log" \
              node packages/text/tests/print-firefox.mjs; code=$?
            echo "::endgroup::"
            echo "iteration $i exit $code"
            [ $code -ne 0 ] && fails=$((fails+1))
          done
          echo "FAILS $fails of 6"
          exit 0
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: diag-${{ matrix.run }}
          retention-days: 3
          path: diag/
