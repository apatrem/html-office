name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Reproduce pinned engine assessment
        run: |
          npm ci --prefix tools/engine-assessment --ignore-scripts
          npm --prefix tools/engine-assessment test
          npm --prefix tools/engine-assessment run measure -- --check
      - name: Validate distributed examples
        run: |
          node plugin/skills/html-slides/tools/check.mjs plugin/skills/html-slides/examples/community-garden.html
          node plugin/skills/html-slides/tools/check.mjs plugin/skills/html-slides/examples/catalogue.html
