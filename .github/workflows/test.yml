name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Reproduce pinned engine assessment
        run: |
          npm ci --prefix tools/engine-assessment --ignore-scripts
          npm --prefix tools/engine-assessment test
          npm --prefix tools/engine-assessment run measure -- --check
      - name: Validate distributed examples
        run: |
          node plugin/skills/html-slides/tools/check.mjs plugin/skills/html-slides/examples/community-garden.html
          node plugin/skills/html-slides/tools/check.mjs plugin/skills/html-slides/examples/catalogue.html

  data-phase-a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/data/package-lock.json
      - run: npm ci
      - run: npm ci --prefix packages/data --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm audit --prefix packages/data --audit-level=high
      - run: npm --prefix packages/data run format:check
      - run: npm run test:data
      - name: Measure the P&L and 50k/100k-row browser workloads
        run: node --expose-gc packages/data/bench/browser.mjs --check --profile --output dist/data-bench/ci-results.json
      - name: Retain Data benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: data-benchmark-diagnostics
          retention-days: 7
          path: |
            dist/data-bench/ci-results.json
            dist/data-bench/browser-results.json
            dist/data-bench/profiles/*.cpuprofile
